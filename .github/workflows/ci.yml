name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The same polyglot shape as fancy-expr: one spec, three implementations, one
# required job per language -- plus a fourth that runs all three legs on the
# same rows and compares their output byte for byte. A language whose suite does
# not run in CI is a language whose agreement with the other two is a claim
# rather than a test result.
jobs:
  # One gate, stated once, that every installing job waits on. A check that
  # finishes beside the thing it guards is a report, not a gate.
  allowlist:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  php:
    needs: allowlist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v7

      # A missing toolchain is a FAILURE, not a skip, so PHP is installed here
      # rather than detected.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Office-file templates (SPEC.md section 12) read zips through ext-zip;
          # named rather than assumed from the runner's default set.
          extensions: zip
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      # composer.lock is not committed. fancy-conformance and fine-print are
      # EXACT require-dev pins for that reason, so the fixture set this job
      # runs is the one composer.json names, not the newest on Packagist.
      - name: Install
        run: composer install --no-interaction --prefer-dist

      # NOT `--if-present` anything: the suite is named explicitly. Pest needs
      # the test directory because there is no root tests/ here.
      - name: Test
        run: vendor/bin/pest --test-directory=php/tests

  node:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The committed package-lock.json pins fancy-conformance to the fixture
      # set tests/conformance.test.ts asserts.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. An absent script makes that step pass by
      # doing nothing, and a green tick over zero assertions is worse than a red
      # one.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The shared fixtures and their Python loader, never on PyPI, at the TAG
      # python/tests/test_conformance.py pins (PINNED_SUITE_VERSION). With no
      # `ref`, every fixture release could turn this job red for a reason no
      # commit here caused. A test fails if this ref and the pin disagree.
      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.36.0
          path: .fancy-conformance
          persist-credentials: false

      # fancy-expr is this leg's one runtime dependency (first-party). It is not
      # on PyPI yet, so the job installs it from its own tagged source -- the
      # floor of the sibling range, so the suite proves the range's lower bound.
      # A test fails if this checkout floats to a branch.
      - name: Check out fancy-expr
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-expr
          ref: v0.2.0
          path: .fancy-expr
          persist-credentials: false

      # `dependency-groups` (PEP 735), so `pip install --group`, which needs
      # pip >= 25.1. fancy-expr first, so the editable install finds the
      # requirement already satisfied instead of asking PyPI for it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./.fancy-expr/python
          python -m pip install -e ./python --group ./python/pyproject.toml:test

      - name: Lint
        run: |
          python -m pip install --group ./python/pyproject.toml:lint
          python -m ruff check python
          python -m ruff format --check python

      - name: Typecheck
        run: |
          python -m pip install --group ./python/pyproject.toml:typecheck
          python -m mypy --config-file python/pyproject.toml

      - name: Test
        working-directory: python
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          PYTHONPATH: ${{ github.workspace }}/.fancy-conformance/python/src
        run: python -m pytest -q

  # All three legs on the same rows: every template/* fixture (no skip honoured
  # for any leg) and every realistic template in examples/corpus.json, compared
  # BYTE FOR BYTE with each other and with the expected column. A GATE: any
  # mismatch on a conformance row is a bug. The writer read-back
  # (`--writers`) needs the nine writer checkouts of the envelope and runs there.
  parity:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.36.0
          path: .fancy-conformance
          persist-credentials: false

      - name: Check out fancy-expr
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-expr
          ref: v0.2.0
          path: .fancy-expr
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: zip
        env:
          update: true
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          npm install --no-audit --no-fund
          npm run build

      - name: Parity (three legs, byte for byte)
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          FANCY_PARITY_PATH: ${{ github.workspace }}/.fancy-expr/python/src:${{ github.workspace }}/.fancy-conformance/python/src
        run: php php/tests/parity.php

      # The comparator itself must be able to fail.
      - name: Parity control (must report 0%)
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          FANCY_PARITY_PATH: ${{ github.workspace }}/.fancy-expr/python/src:${{ github.workspace }}/.fancy-conformance/python/src
        run: |
          php php/tests/parity.php --control > control.log 2>&1 && { cat control.log; echo "::error::the control reported no mismatch"; exit 1; }
          cat control.log
          grep -q "3 legs equal   0/" control.log

name: Publish

# Fires on a version tag and releases the three legs:
#
#   - PHP: Packagist syncs from the tag ON ITS OWN, so nothing here can prevent
#     that release -- by the time this runs it is resolvable. The changelog gate
#     below is a REPORT for PHP (the changelog is served from the repo, so fixing
#     it on main afterwards is a complete fix there).
#   - npm and PyPI: published HERE, and only after the changelog gate passes.
#     Those tarballs are immutable, so the gate BLOCKS them.
#
# Both registry names are new. Each needs the owner's one-time bootstrap
# (.ai/knowledge/publishing.md in the envelope) before Trusted Publishing can
# take over; until then the npm and PyPI jobs fail and the PHP release is
# unaffected.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  # Code fetched from another repository (the third-party allowlist) runs HERE,
  # in a job holding nothing but `contents: read` -- never in a job that can
  # publish or write. Every installing job needs it, so none can start until the
  # check has passed. `node .ai/tools/pin-github-checks.mjs --check` in the
  # envelope enforces this shape.
  guard:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  changelog:
    name: Changelog entry and versions for this tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the tagged version is documented, and first
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi

          # Both house styles: `## 1.2.3 -- date` and Keep a Changelog's `## [1.2.3] - date`.
          if ! grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}."
            echo "::error::Add one -- say what a consumer must DO, not just what changed."
            echo "::error::Packagist has already published this tag (fix the entry on main now); npm and PyPI are held."
            exit 1
          fi

          # STRUCTURE, not just presence: at release time the tagged version IS
          # the newest, so it must be the first version heading. [Unreleased]
          # may precede it.
          FIRST=$(grep -E '^## ' CHANGELOG.md | grep -viE '^## +\[?unreleased\]?' | head -1)
          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            exit 1
          fi
          echo "Found a changelog entry for ${VERSION}, and it is the newest."

      # Each registry ships the version ITS manifest declares, so each manifest
      # -- not just the tag -- must say the tagged version.
      - name: Assert package.json and python/pyproject.toml match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const v=require("./package.json").version; if (v !== process.argv[1]) { console.log("::error::package.json declares " + v + ", the tag is " + process.argv[1]); process.exit(1); }' "$VERSION"
          grep -q "^version = \"${VERSION}\"$" python/pyproject.toml || {
            echo "::error::python/pyproject.toml does not declare ${VERSION}."
            exit 1
          }

  npm:
    name: Publish to npm
    needs: [guard, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing (OIDC) and provenance; there is no token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public

  # PyPI: build and publish are separate jobs so `id-token: write` is never
  # held by the job that executes build code.
  build-python:
    name: Build the Python distributions
    needs: [guard, changelog]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # `--sdist --wheel` explicitly. Bare `python -m build` builds the wheel FROM
      # the sdist, and the wheel's force-include of ../profiles reaches outside
      # python/, which an unpacked sdist does not have.
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      # The wheel must carry what the package reads at run time: the profiles
      # (an installed package has no checkout to fall back on) and py.typed
      # (claimed by the classifiers).
      - name: The wheel carries the profiles and py.typed
        working-directory: python
        run: |
          python -c "import glob,zipfile,sys; n=set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()); want={'fancy_template/py.typed'}|{f'fancy_template/profiles/{w}.json' for w in ('fine-print','last-word','dark-slide','holy-sheet')}; missing=sorted(want-n); print('missing from wheel:', missing); sys.exit(1 if missing else 0)"

      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: python/dist/

  publish-python:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fancy-template
    permissions:
      id-token: write        # mandatory for Trusted Publishing; there is no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/
      # Pinned by SHA, not by tag: a mutable reference in exactly this position
      # is what the April 2026 supply-chain compromises exploited.
      # v1.14.2 -- no `password:` (that is the point), attestations default on.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  # Packagist publishes from the tag on its own, so a release can be fully
  # installable and invisible on GitHub. The notes come from CHANGELOG.md, so
  # there is no second description to drift. It waits only on the changelog
  # gate: the PHP leg is already live, and an npm or PyPI bootstrap still
  # pending must not hide a release that consumers can install.
  release:
    name: GitHub release
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."
